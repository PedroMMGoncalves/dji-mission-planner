name: Release

# Uma etiqueta vX.Y.Z (a mesma versão do package.json) corre as verificações
# do CI, constrói a aplicação e publica a GitHub Release com as notas do
# CHANGELOG e o build estático em zip — a app é 100% cliente, o zip serve
# qualquer servidor web ou uso offline. Também se pode disparar à mão sobre
# um ramo: nesse caso a etiqueta é criada pela própria release, no commit
# escolhido, e tem de ser a versão do package.json.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão a publicar (sem o v; por omissão, a do package.json)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # só este job cria a release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - run: npm run size

      - name: A etiqueta tem de ser a versão do package.json
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          PKG="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            VER="${INPUT_VERSION:-$PKG}"
          else
            VER="${GITHUB_REF_NAME#v}"
          fi
          if [ "$VER" != "$PKG" ]; then
            echo "versao v$VER != package.json $PKG"; exit 1
          fi
          echo "TAG=v$VER" >> "$GITHUB_ENV"

      - name: Notas da release a partir do CHANGELOG
        run: |
          VER="${TAG#v}"
          awk -v ver="$VER" '
            /^## / { on = index($0, "## " ver) == 1; next }
            on { print }
          ' CHANGELOG.md > notas.md
          test -s notas.md || { echo "CHANGELOG.md sem seccao ## $VER"; exit 1; }

      - name: Zip do build estático
        run: (cd dist && zip -qr "../dji-mission-planner-${TAG}.zip" .)

      - name: Criar a GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # sem etiqueta ainda (disparo manual), o gh cria-a no commit alvo
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes-file notas.md \
            "dji-mission-planner-${TAG}.zip"
