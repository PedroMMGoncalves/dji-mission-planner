name: Release

# Publica a GitHub Release da versão do package.json — etiqueta vX.Y.Z,
# notas extraídas do CHANGELOG e o build estático em zip (a app é 100%
# cliente: o zip serve qualquer servidor web ou uso offline).
#
# Dispara em cada push a main: se a etiqueta v<versão> já existir não faz
# nada, pelo que subir a versão no package.json (com a secção respectiva no
# CHANGELOG) é o gesto que publica. Também aceita uma etiqueta empurrada à
# mão ou o disparo manual. A etiqueta é criada pela própria release, no
# commit em que corre, e tem sempre de ser a versão do package.json.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão a publicar (sem o v; por omissão, a do package.json)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # só este job cria a etiqueta e a release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Versão a publicar (e se já foi)
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          PKG="$(node -p "require('./package.json').version")"
          case "$GITHUB_EVENT_NAME" in
            workflow_dispatch) VER="${INPUT_VERSION:-$PKG}" ;;
            *) case "$GITHUB_REF" in
                 refs/tags/*) VER="${GITHUB_REF_NAME#v}" ;;
                 *) VER="$PKG" ;;
               esac ;;
          esac
          if [ "$VER" != "$PKG" ]; then
            echo "versao v$VER != package.json $PKG"; exit 1
          fi
          echo "TAG=v$VER" >> "$GITHUB_ENV"
          if gh release view "v$VER" >/dev/null 2>&1; then
            echo "v$VER ja publicada — nada a fazer"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.ver.outputs.publish == 'true'
        run: npm ci
      - if: steps.ver.outputs.publish == 'true'
        run: npm run lint
      - if: steps.ver.outputs.publish == 'true'
        run: npm run test
      - if: steps.ver.outputs.publish == 'true'
        run: npm run build
      - if: steps.ver.outputs.publish == 'true'
        run: npm run size

      - name: Notas da release a partir do CHANGELOG
        if: steps.ver.outputs.publish == 'true'
        run: |
          VER="${TAG#v}"
          awk -v ver="$VER" '
            /^## / { on = index($0, "## " ver) == 1; next }
            on { print }
          ' CHANGELOG.md > notas.md
          test -s notas.md || { echo "CHANGELOG.md sem seccao ## $VER"; exit 1; }

      - name: Zip do build estático
        if: steps.ver.outputs.publish == 'true'
        run: (cd dist && zip -qr "../dji-mission-planner-${TAG}.zip" .)

      - name: Criar a etiqueta e a GitHub Release
        if: steps.ver.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # sem etiqueta ainda, o gh cria-a no commit em que corre
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes-file notas.md \
            "dji-mission-planner-${TAG}.zip"
