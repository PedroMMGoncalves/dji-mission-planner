name: Nocturno

# Exploração fora do portão (M3-T7): os testes por propriedades com uma
# semente aleatória (um contra-exemplo passa a teste fixo) e as asserções de
# tempo (PERF=1), que no portão são só registadas.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  explorar:
    name: Propriedades com semente aleatória e tempos
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Semente desta noite
        run: echo "FC_SEED=$((RANDOM * 32768 + RANDOM))" >> "$GITHUB_ENV"
      - name: Unitários (propriedades com semente aleatória, tempos a valer)
        env:
          PERF: '1'
        run: npm run test:unit
      - run: npm run test:smoke
