name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    name: Lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npx eslint .
      - name: Test suite
        run: node smoke-test.mjs
      - name: Production build
        run: npm run build
