name: CI

on:
  push:
  pull_request:

# Um push novo no mesmo ramo cancela a execução anterior; em main nada é
# cancelado, para o histórico de integração ficar completo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Privilégio mínimo: a verificação só lê o repositório.
permissions:
  contents: read

jobs:
  checks:
    name: Lint, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Acções fixadas ao SHA: uma etiqueta móvel pode ser reapontada para
      # código diferente sem o repositório mudar.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install (lockfile exacto)
        run: npm ci

      - name: Lint
        run: npm run lint

      # JSDoc + tsc --checkJs sobre o motor e os hooks (sem emitir nada)
      - name: Typecheck
        run: npm run typecheck

      # Suites historicas sob c8, com limiares que so podem subir
      - name: Test suite (with coverage thresholds)
        run: npm run test:coverage
      - name: Property-based tests
        run: npm run test:unit

      - name: Production build
        run: npm run build

      - name: Bundle budget
        run: npm run size

      # A árvore de produção é o que chega ao utilizador e tem de estar limpa.
      - name: Audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high

      # As dependências de desenvolvimento não são servidas, mas um aviso aqui
      # é o sinal para actualizar; informativo, não bloqueia.
      - name: Audit (all dependencies, informational)
        run: npm audit --audit-level=moderate || true

  # E2E sobre a build de produção: importa polígono e MDT sintéticos pela
  # interface, liga modos, exporta o KMZ e mede o ficheiro (folga ao solo em
  # toda a rota, grupos de disparo, blocos). É a única rede que apanha
  # defeitos na ligação entre painel, estado e exportação.
  e2e:
    name: E2E (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: checks
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
      - name: Capturas e ficheiros exportados (em falha)
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: e2e-out
          path: tests/e2e/out
          if-no-files-found: ignore
